services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: market77
      POSTGRES_PASSWORD: market77
      POSTGRES_DB: market77
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata: {}
